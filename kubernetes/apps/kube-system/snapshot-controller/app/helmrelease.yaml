---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/home-operations/charts/snapshot-controller
      ref:
        tag: 0.1.2
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token.actions.githubusercontent.com$"
            subject: "^https://github.com/home-operations/helm-charts.*$"
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
  values:
    monitoring:
      serviceMonitor:
        enabled: true
    controller:
      volumeGroupSnapshots: false
