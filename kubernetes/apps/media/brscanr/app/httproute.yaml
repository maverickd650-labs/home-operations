---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: brscanr
  labels:
    app.kubernetes.io/instance: brscanr
    app.kubernetes.io/name: brscanr
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "brscanr.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: brscanr
          port: 8080
