---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  chartRef:
    kind: OCIRepository
    name: headlamp
  interval: 1h
  values:
    fullnameOverride: headlamp
    clusterRoleBinding:
      create: false
    config:
      extraArgs:
        - "-in-cluster"
      watchPlugins: true
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: headlamp-plugin-flux
            version: "0.8.0"
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp-plugin-flux
          - name: cnpg-headlamp-plugin
            version: "0.1.6"
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/cnpg-headlamp-plugin
          - name: headlamp_cert-manager
            version: "0.1.1"
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
        installOptions:
          parallel: true
          maxConcurrent: 2
      baseImage: node:lts-alpine
      version: latest
    podAnnotations:
      reloader.stakater.com/auto: "true"
    service:
      port: 4466
    httpRoute:
      enabled: true
      hostnames:
        - "headlamp.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-internal
          namespace: network
    serviceAccount:
      create: false
      name: headlamp-admin
