---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
spec:
  chartRef:
    kind: OCIRepository
    name: common
    namespace: system
  interval: 1h
  timeout: 20m
  maxHistory: 3
  upgrade:
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.19.3@sha256:189e03bb73bb86d7108fe81cbe2237c408cff2176b14cd7a39cc12a2ee8b2762
            env:
              DB_CONNECTION_STRING: file:/app/data/pocket-id.db?_journal_mode=WAL&_busy_timeout=2500&_txlock=immediate
              APP_URL: https://pocket.${SECRET_DOMAIN}
              TRUST_PROXY: "true"
              UPLOAD_PATH: /app/data/uploads
              METRICS_ENABLED: "true"
              OTEL_METRICS_EXPORTER: "prometheus"
              ALLOW_DOWNGRADE: "true"
            envFrom:
              - secretRef:
                  name: pocket-id
    externalSecrets:
      pocket-id:
        refreshInterval: 6h
        secretStoreRef:
          kind: ClusterSecretStore
          name: infisical
        target:
          name: pocket-id
        data:
          - secretKey: ENCRYPTION_KEY
            remoteRef:
              key: pocketid/ENCRYPTION_KEY
    service:
      main:
        ports:
          main:
            port: 1411
    route:
      internal:
        hostnames:
          - pocket.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: pocket-id-config
        globalMounts:
          - path: /app/data
