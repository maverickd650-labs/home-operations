---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: mealie
  target:
    name: mealie-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: mealie
        password: "{{ .MEALIE_POSTGRES_PASSWORD }}"
        uri: "postgres://mealie:{{ .MEALIE_POSTGRES_PASSWORD }}@mealie-postgres-rw:5432/mealie?sslmode=require&connect_timeout=10"
  data:
    - secretKey: MEALIE_POSTGRES_PASSWORD
      remoteRef:
        key: cnpg/MEALIE_POSTGRES_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-postgres-backup-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: mealie-postgres-backup-credentials
  data:
    - secretKey: accesskey
      remoteRef:
        key: cnpg/S3_ID
    - secretKey: secretkey
      remoteRef:
        key: cnpg/S3_KEY
