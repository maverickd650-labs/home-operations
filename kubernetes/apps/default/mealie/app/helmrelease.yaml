---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: common
    namespace: system
  driftDetection:
    mode: enabled
  upgrade:
    cleanupOnFail: true
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      mealie:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
            env:
              BASE_URL: "https://mealie.${SECRET_DOMAIN}"
              DB_ENGINE: "postgres"
              POSTGRES_USER: "mealie"
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: mealie-postgres-credentials
                    key: password
              POSTGRES_SERVER: "mealie-postgres-rw"
              POSTGRES_PORT: 5432
              POSTGRES_DB: "mealie"
              OIDC_AUTH_ENABLED: true
              OIDC_SIGNUP_ENABLED: true
              OIDC_CONFIGURATION_URL: "https://pocket.${SECRET_DOMAIN}/.well-known/openid-configuration"
              OIDC_PROVIDER_NAME: "Pocket ID"
              OIDC_ADMIN_GROUP: "admin"
              OIDC_USER_CLAIM: "preferred_username"
              SMTP_AUTH_STRATEGY: TLS
              SMTP_FROM_NAME: "Mealie"
              SMTP_PORT: 2525
              TZ: Europe/London
            envFrom:
              - secretRef:
                  name: mealie-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 400Mi
              limits:
                memory: 600Mi
    route:
      app:
        hostnames:
          - "mealie.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: 9000
    persistence:
      data:
        existingClaim: mealie-config
        globalMounts:
          - path: /data/data
