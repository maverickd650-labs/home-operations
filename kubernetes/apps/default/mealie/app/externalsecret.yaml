---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: mealie-secret
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: pocketid/mealie_client
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: pocketid/mealie_secret
    - secretKey: SMTP_FROM_EMAIL
      remoteRef:
        key: mealie/smtp-email
    - secretKey: SMTP_HOST
      remoteRef:
        key: mealie/smtp-host
    - secretKey: SMTP_USER
      remoteRef:
        key: mealie/smtp-user
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: mealie/smtp-password
