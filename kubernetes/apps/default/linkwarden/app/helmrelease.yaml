---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkwarden
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: common
    namespace: system
  driftDetection:
    mode: enabled
  upgrade:
    cleanupOnFail: true
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      linkwarden:
        containers:
          app:
            image:
              repository: ghcr.io/linkwarden/linkwarden
              tag: v2.17.0@sha256:7c11fde57d1a0c819b6de0079966eba3a33584d718464af7dacde22bd470ae46
            env:
              NEXTAUTH_URL: "https://link.${SECRET_DOMAIN}/api/v1/auth"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-postgres-credentials
                    key: uri
              NEXT_PUBLIC_DISABLE_REGISTRATION: false
              NEXT_PUBLIC_CREDENTIALS_ENABLED: true
              NEXT_PUBLIC_OIDC_ENABLED: true
              OIDC_CUSTOM_NAME: "Pocket ID"
              OIDC_WELLKNOWN_URL: "https://pocket.${SECRET_DOMAIN}/.well-known/openid-configuration"
            envFrom:
              - secretRef:
                  name: linkwarden-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 20m
                memory: 512Mi
              limits:
                memory: 2Gi
    route:
      app:
        hostnames:
          - "link.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: 3000
    persistence:
      data:
        existingClaim: linkwarden-config
        globalMounts:
          - path: /data/data
