---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rss2discord
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/maverickd650-labs/charts/rss2discord-operator
      ref:
        tag: 0.19.2
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "https://token.actions.githubusercontent.com"
            subject: "^https://github.com/maverickd650-labs/rss2discord.*$"
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
  install:
    crds: CreateReplace
  values:
    prometheus:
      enabled: true
    prometheusRule:
      enabled: true
    grafanaDashboard:
      enabled: true
      allowCrossNamespaceImport: true
      instanceSelector:
        matchLabels:
          grafana.internal/instance: grafana
