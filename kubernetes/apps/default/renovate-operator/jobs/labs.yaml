---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: labs-repositories
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  provider:
    name: github
  discoverTopics:
    - renovate
  extraEnv:
    - name: RENOVATE_ALLOWED_ENV
      value: MISE_TRUSTED_CONFIG_PATHS
    - name: RENOVATE_ALLOWED_COMMANDS
      value: '["pnpm run bundle"]'
    - name: RENOVATE_ALLOW_PLUGINS
      value: "true"
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_REDIS_URL
      value: "redis://dragonfly.system.svc.cluster.local:6379"
    - name: RENOVATE_REDIS_PREFIX
      value: "labs:"
  image: ghcr.io/renovatebot/renovate:45.1.0
  parallelism: 1
  resources:
    requests:
      cpu: 735m
      memory: 2420Mi
    limits:
      memory: 2420Mi
  schedule: "30 */6 * * *"
  githubAppReference:
    secretName: labs-bot-credentials
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  webhook:
    enabled: true
    authentication:
      enabled: false
