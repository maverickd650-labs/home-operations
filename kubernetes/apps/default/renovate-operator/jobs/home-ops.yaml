---
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
data:
  config.js: |
    module.exports = {
      platform: 'github',
      cacheDir: '/cache/renovate',
    };
---
# yaml-language-server: $schema=https://schema.maverickd650.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: home-ops
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  provider:
    name: github
  discoveryFilters:
    - "maverickd650-labs/home-operations"
  extraEnv:
    - name: RENOVATE_ALLOWED_ENV
      value: MISE_TRUSTED_CONFIG_PATHS
    - name: RENOVATE_CONFIG_FILE
      value: /config/config.js
    - name: RENOVATE_PERSIST_REPO_DATA
      value: "true"
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_REPOSITORY_CACHE
      value: "enabled"
    - name: RENOVATE_ALLOWED_COMMANDS
      value: '["pnpm run bundle"]'
    - name: RENOVATE_ALLOW_PLUGINS
      value: "true"
    - name: RENOVATE_REDIS_URL
      value: "redis://dragonfly.system.svc.cluster.local:6379"
  image: ghcr.io/renovatebot/renovate:45.3.2
  parallelism: 1
  resources:
    requests:
      cpu: 735m
      memory: 2420Mi
    limits:
      memory: 2420Mi
  extraVolumes:
    - name: renovate-cache
      persistentVolumeClaim:
        claimName: renovate-cache-home-ops
    - name: renovate-config
      configMap:
        name: renovate-config
  extraVolumeMounts:
    - name: renovate-cache
      mountPath: /cache
    - name: renovate-config
      mountPath: /config
  schedule: "@hourly"
  githubAppReference:
    secretName: labs-bot-credentials
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  webhook:
    enabled: true
    authentication:
      enabled: false
