---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: labs-bot-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: labs-bot-credentials
    template:
      engineVersion: v2
      metadata:
        labels:
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        APP_ID: "{{ .APP_ID | trim }}"
        INSTALL_ID: "{{ .INSTALL_ID | trim }}"
        PEM: "{{ .PEM }}"
  data:
    - secretKey: APP_ID
      remoteRef:
        key: renovate/GITHUB_LAB_ID
    - secretKey: INSTALL_ID
      remoteRef:
        key: renovate/GITHUB_LAB_INSTALL
    - secretKey: PEM
      remoteRef:
        key: renovate/GITHUB_LAB_PEM
