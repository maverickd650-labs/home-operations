---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Package Cleanup"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  clean:
    runs-on: ubuntu-latest
    name: Delete old GHCR images
    permissions:
      contents: read
      packages: write # for deleting packages
    environment:
      name: bot
      deployment: false
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-packages: write 
      - uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: maverickd650-labs
          token: ${{ steps.app-token.outputs.token }}
          image-names: "home-operations"
          cut-off: 1w
          dry-run: false
