---
name: push-artifact

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "kubernetes/**"
    tags:
      - "*"

jobs:
  flux-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install flux
        uses: controlplaneio-fluxcd/distribution/actions/setup@v2.10.1
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare tags
        id: prep
        run: |
          TAG=latest
          VERSION="${REF_NAME}-${GITHUB_SHA::8}"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=latest-stable
            VERSION="${REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        env:
          REF_NAME: ${{ github.ref_name }}
      - name: Push artifact
        uses: controlplaneio-fluxcd/distribution/actions/push@v2.10.1
        id: push
        with:
          repository: ghcr.io/${{ github.repository }}
          path: "./"
          ignore-paths: |
            /*
            !/kubernetes/
          diff-tag: ${{ steps.prep.outputs.tag }}
          tags: ${{ steps.prep.outputs.version }}
      - name: Sign artifact
        if: steps.push.outputs.pushed == 'true'
        run: cosign sign --yes $DIGEST_URL
        env:
          DIGEST_URL: ${{ steps.push.outputs.digest-url }}
